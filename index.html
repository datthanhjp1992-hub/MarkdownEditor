<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Editor - HackMD style</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  :root{
    --bg:#0d1117;
    --panel:#161b22;
    --border:#30363d;
    --text:#e6edf3;
    --muted:#8b949e;
    --accent:#58a6ff;
    --code-bg:#0d1117;
    --line-num:#484f58;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:#1e2229;
    color:var(--text);
    min-height:100vh;
  }
  .frame{
    width:100%;
    height:100vh;
    background:var(--panel);
    border:none;
    border-radius:0;
    overflow:hidden;
    box-shadow:none;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .titlebar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
    gap:10px;
  }
  .filename{
    font-weight:600;
    font-size:15px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .filename svg{opacity:.6; flex-shrink:0;}
  #fileNameText{
    cursor:pointer;
    border-radius:4px;
    padding:2px 6px;
    margin:-2px -6px;
    transition:background .12s;
  }
  #fileNameText:hover, #fileNameText:focus{
    background:#21262d;
    outline:none;
  }
  .filename-input{
    background:#0d1117;
    border:1px solid var(--accent);
    color:var(--text);
    font-weight:600;
    font-size:15px;
    font-family:inherit;
    border-radius:4px;
    padding:2px 6px;
    width:180px;
    outline:none;
  }
  .clear-btn{
    display:flex;
    align-items:center;
    gap:6px;
    border:1px solid var(--border);
    background:#0d1117;
    color:var(--muted);
    font-size:13px;
    padding:6px 12px;
    border-radius:8px;
    cursor:pointer;
    transition:border-color .15s, color .15s;
    white-space:nowrap;
  }
  .clear-btn:hover{border-color:#f85149; color:#f85149;}

  /* ===== Confirm modal ===== */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:20px 22px;
    width:320px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .modal-box h3{margin:0 0 8px; font-size:15px;}
  .modal-box p{margin:0 0 18px; font-size:13px; color:var(--muted); line-height:1.5;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px;}
  .modal-btn{
    border:none;
    border-radius:6px;
    padding:7px 14px;
    font-size:13px;
    cursor:pointer;
  }
  .modal-btn.cancel{background:#21262d; color:var(--text);}
  .modal-btn.cancel:hover{background:#2d333b;}
  .modal-btn.confirm{background:#f85149; color:#fff;}
  .modal-btn.confirm:hover{background:#e5433b;}
  .status{
    font-size:12px;
    color:var(--muted);
    font-weight:400;
    margin-left:8px;
  }
  .controls{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .import-btn, .export-btn{
    display:flex;
    align-items:center;
    gap:6px;
    border:1px solid var(--border);
    background:#0d1117;
    color:var(--muted);
    font-size:13px;
    padding:6px 12px;
    border-radius:8px;
    cursor:pointer;
    transition:border-color .15s, color .15s;
    white-space:nowrap;
  }
  .import-btn:hover, .export-btn:hover{border-color:var(--accent); color:var(--accent);}

  .toggle-group{
    display:flex;
    background:#0d1117;
    border:1px solid var(--border);
    border-radius:8px;
    padding:2px;
  }
  .toggle-btn{
    border:none;
    background:transparent;
    color:var(--muted);
    padding:6px 12px;
    font-size:13px;
    border-radius:6px;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .toggle-btn.active{background:#21262d; color:var(--accent);}
  .toggle-btn:hover{color:var(--text);}

  /* ===== Formatting toolbar ===== */
  .toolbar{
    display:flex;
    align-items:center;
    gap:2px;
    padding:6px 12px;
    background:#10141a;
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  .tb-btn{
    border:none;
    background:transparent;
    color:var(--muted);
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
    font-family:"SF Mono",Consolas,monospace;
    transition:background .12s, color .12s;
  }
  .tb-btn:hover{background:#21262d; color:var(--text);}
  .tb-btn:active{background:#2d333b;}
  .tb-btn svg{width:16px; height:16px;}
  .tb-sep{
    width:1px;
    height:20px;
    background:var(--border);
    margin:0 6px;
    flex-shrink:0;
  }

  /* ===== Editor / Preview layout ===== */
  .workspace{
    display:grid;
    grid-template-columns:1fr 1fr;
    flex:1;
    min-height:0;
  }
  .frame.mode-edit .workspace{grid-template-columns:1fr;}
  .frame.mode-edit .preview-pane{display:none;}
  .frame.mode-preview .workspace{grid-template-columns:1fr;}
  .frame.mode-preview .editor-pane{display:none;}

  .editor-pane{
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    min-width:0;
    min-height:0;
  }
  .frame.mode-edit .editor-pane{border-right:none;}

  .pane-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--muted);
    padding:8px 16px;
    border-bottom:1px solid var(--border);
    background:#10141a;
  }

  #editor{
    flex:1;
    width:100%;
    resize:none;
    border:none;
    outline:none;
    background:var(--code-bg);
    color:#c9d1d9;
    font-family:"SF Mono",Consolas,"Courier New",monospace;
    font-size:13.5px;
    line-height:1.65;
    padding:16px 18px;
    tab-size:2;
  }

  .preview-pane{
    display:flex;
    flex-direction:column;
    min-width:0;
    min-height:0;
    overflow:hidden;
  }
  #previewContent{
    flex:1;
    overflow-y:auto;
    padding:18px 24px;
    line-height:1.65;
    font-size:15px;
  }
  #previewContent h1{font-size:24px; margin-bottom:6px;}
  #previewContent h2{font-size:18px; margin-top:24px; border-bottom:1px solid var(--border); padding-bottom:6px;}
  #previewContent p{color:#c9d1d9;}
  #previewContent pre{
    background:#0a0d12;
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    overflow-x:auto;
    font-size:13px;
  }
  #previewContent code{font-family:"SF Mono",Consolas,monospace;}
  #previewContent table{border-collapse:collapse; width:100%; margin:12px 0;}
  #previewContent th, #previewContent td{border:1px solid var(--border); padding:6px 10px; font-size:13px;}
  #previewContent blockquote{border-left:3px solid var(--accent); margin:0; padding:2px 14px; color:var(--muted);}
  #previewContent img{max-width:100%;}

  .dropzone-overlay{
    position:absolute;
    inset:0;
    background:rgba(13,17,23,.92);
    border:2px dashed var(--accent);
    border-radius:12px;
    display:none;
    align-items:center;
    justify-content:center;
    color:var(--accent);
    font-size:15px;
    font-weight:500;
    z-index:10;
    pointer-events:none;
  }
  .frame.dragging .dropzone-overlay{display:flex;}

  @media (max-width:720px){
    .workspace{grid-template-columns:1fr !important; overflow-y:auto;}
    .editor-pane{border-right:none; border-bottom:1px solid var(--border);}
    #editor{min-height:45vh;}
  }
</style>
</head>
<body>

<div class="frame mode-split" id="frame">
  <div class="titlebar">
    <div class="filename">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M4 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V5.414A2 2 0 0 0 13.414 4L10 0.586A2 2 0 0 0 8.586 0H4Zm0 1h4v3a1 1 0 0 0 1 1h3v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Z"/></svg>
      <span id="fileNameText" tabindex="0" title="Bấm để đổi tên file">untitled.md</span>

    <div class="controls">

        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a.75.75 0 0 1 .75.75v6.19l2.22-2.22a.75.75 0 1 1 1.06 1.06l-3.5 3.5a.75.75 0 0 1-1.06 0l-3.5-3.5a.75.75 0 1 1 1.06-1.06l2.22 2.22V1.75A.75.75 0 0 1 8 1ZM2.5 11a.75.75 0 0 1 .75.75v1.5c0 .14.11.25.25.25h9a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 12.5 15h-9A1.75 1.75 0 0 1 1.75 13.25v-1.5A.75.75 0 0 1 2.5 11Z"/></svg>
        Import
      </button>
      <button class="export-btn" id="btnExport" title="Tải về file .md">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M7.47 10.78a.75.75 0 0 0 1.06 0l3.75-3.75a.75.75 0 0 0-1.06-1.06L8.75 8.44V1.75a.75.75 0 0 0-1.5 0v6.69L4.78 5.97a.75.75 0 0 0-1.06 1.06l3.75 3.75ZM3.75 13a.75.75 0 0 0 0 1.5h8.5a.75.75 0 0 0 0-1.5h-8.5Z"/></svg>
        Tải xuống
      </button>
      <input type="file" id="fileInput" accept=".md,.markdown,.txt" style="display:none;">
      <div class="toggle-group">
        <button class="toggle-btn" id="btnEdit" title="Chỉ soạn thảo">Edit</button>
        <button class="toggle-btn active" id="btnSplit" title="Soạn thảo + Xem trước">Split</button>
        <button class="toggle-btn" id="btnPreview" title="Chỉ xem trước">Preview</button>
      </div>
    </div>
  </div>

  <div class="toolbar" id="toolbar">
    <button class="tb-btn" data-action="undo" title="Undo (Ctrl+Z)">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2.5 8a5.5 5.5 0 0 1 9.44-3.86l.85-.85A.5.5 0 0 1 13.65 3.6V7a.5.5 0 0 1-.5.5H9.25a.5.5 0 0 1-.35-.85l1.1-1.1A4 4 0 1 0 12 8a.75.75 0 0 1 1.5 0A5.5 5.5 0 1 1 2.5 8Z"/></svg>
    </button>
    <button class="tb-btn" data-action="redo" title="Redo (Ctrl+Y)">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M13.5 8a5.5 5.5 0 0 0-9.44-3.86l-.85-.85A.5.5 0 0 0 2.35 3.6V7a.5.5 0 0 0 .5.5h3.9a.5.5 0 0 0 .35-.85L6 5.55A4 4 0 1 1 4 8a.75.75 0 0 0-1.5 0A5.5 5.5 0 1 0 13.5 8Z"/></svg>
    </button>
    <div class="tb-sep"></div>
    <button class="tb-btn" data-action="bold" title="In đậm (Ctrl+B)"><b>B</b></button>
    <button class="tb-btn" data-action="italic" title="In nghiêng (Ctrl+I)"><i>I</i></button>
    <button class="tb-btn" data-action="strike" title="Gạch ngang">S̶</button>
    <button class="tb-btn" data-action="heading" title="Tiêu đề">H</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" data-action="code" title="Code">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M5.7 3.3 1 8l4.7 4.7 1.1-1.1L3.2 8l3.6-3.6L5.7 3.3Zm4.6 0-1.1 1.1L12.8 8l-3.6 3.6 1.1 1.1L15 8 10.3 3.3Z"/></svg>
    </button>
    <button class="tb-btn" data-action="quote" title="Trích dẫn">"</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" data-action="ul" title="Danh sách gạch đầu dòng">
      <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="2" cy="4" r="1"/><circle cx="2" cy="8" r="1"/><circle cx="2" cy="12" r="1"/><rect x="5" y="3.3" width="10" height="1.4"/><rect x="5" y="7.3" width="10" height="1.4"/><rect x="5" y="11.3" width="10" height="1.4"/></svg>
    </button>
    <button class="tb-btn" data-action="ol" title="Danh sách đánh số" style="font-size:11px;">1.</button>
    <button class="tb-btn" data-action="task" title="Checklist">
      <svg viewBox="0 0 16 16" fill="currentColor"><rect x="1.5" y="1.5" width="13" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M4.5 8l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
    <div class="tb-sep"></div>
    <button class="tb-btn" data-action="link" title="Chèn liên kết">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M6.5 9.5a1 1 0 0 0 1.4 0l3.6-3.6a1 1 0 1 0-1.4-1.4L9 5.6V3.5a2.5 2.5 0 1 1 5 0v3a2.5 2.5 0 0 1-.73 1.77l-2 2A2.5 2.5 0 0 1 7 8.5V6.4l-1.1 1.1a1 1 0 0 0 0 1.4l.6.6ZM9.5 6.5a1 1 0 0 0-1.4 0L4.5 10.1a1 1 0 1 0 1.4 1.4L7 10.4v2.1a2.5 2.5 0 1 0 5 0v-3a2.5 2.5 0 0 0 .73-1.77"/></svg>
    </button>
    <button class="tb-btn" data-action="image" title="Chèn hình ảnh">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 3a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1H2Zm0 1h12v6.5l-3-3-3.5 3.5-2-2L2 12V4Zm2.5 3a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/></svg>
    </button>
    <button class="tb-btn" data-action="table" title="Chèn bảng">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 2.5h13v11h-13v-11Zm1.5 1.5v2.5h4V4H3Zm5.5 0v2.5H13V4H8.5ZM3 7.5V10h4V7.5H3Zm5.5 0V10H13V7.5H8.5ZM3 11v2.5h4V11H3Zm5.5 0v2.5H13V11H8.5Z"/></svg>
    </button>
    <div class="tb-sep"></div>
    <button class="tb-btn" data-action="hr" title="Đường kẻ ngang">—</button>
    <button class="tb-btn" data-action="comment" title="Chèn ghi chú">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2v3l3.5-3H14a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1H2Z"/></svg>
    </button>
    <div class="tb-sep"></div>
    <button class="clear-btn" id="btnClear" title="Xoá toàn bộ nội dung">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M6.5 1a.5.5 0 0 0-.5.5V2H3.5a.5.5 0 0 0 0 1H4v10a1.5 1.5 0 0 0 1.5 1.5h5A1.5 1.5 0 0 0 12 13V3h.5a.5.5 0 0 0 0-1H10v-.5a.5.5 0 0 0-.5-.5h-3ZM6 4.5a.5.5 0 0 1 1 0v7a.5.5 0 0 1-1 0v-7Zm3 0a.5.5 0 0 1 1 0v7a.5.5 0 0 1-1 0v-7Z"/></svg>
      Clear
    </button>
  </div>

  <div class="modal-overlay" id="clearModal">
    <div class="modal-box">
      <h3>Xoá toàn bộ nội dung?</h3>
      <p>Hành động này sẽ xoá sạch nội dung hiện tại trong editor và không thể hoàn tác. Bạn có chắc chắn muốn tiếp tục?</p>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="clearCancel">Huỷ</button>

  <div class="workspace">

# Tiêu đề
**In đậm** và *in nghiêng*
- Danh sách
"></textarea>
    </div>
    <div class="preview-pane">
      <div class="pane-label">Xem trước</div>

<script>
const editor = document.getElementById('editor');
const previewContent = document.getElementById('previewContent');
const frame = document.getElementById('frame');
const statusText = document.getElementById('statusText');
const fileNameText = document.getElementById('fileNameText');

// Bật breaks:true để giống HackMD -- 1 dấu xuống dòng đơn trong đoạn văn/list item
// sẽ giữ nguyên thành <br> thay vì bị CommonMark mặc định gộp lại thành khoảng trắng.
marked.setOptions({ breaks: true });

const defaultContent = `# Markdown Editor 👋

---

## Phần 1 — Giới thiệu

Đây là một **trình soạn thảo Markdown trực tiếp** (live editor), lấy cảm hứng từ HackMD. Gõ nội dung ở khung bên trái, kết quả sẽ được render và hiển thị ngay lập tức ở khung bên phải — không cần bấm nút "xem trước" hay tải lại trang.

Editor hỗ trợ 3 chế độ xem: **Edit** (chỉ soạn thảo, toàn màn hình), **Split** (soạn thảo song song xem trước — đang bật), và **Preview** (chỉ xem kết quả). Bạn có thể chuyển đổi qua nút ở góc trên bên phải.

Ngoài ra bạn có thể **Import** file \`.md\` có sẵn (kéo-thả hoặc chọn file), **Tải xuống** nội dung đang soạn thành file mới, bấm vào tên file ở góc trên bên trái để **đổi tên**, hoặc dùng nút **Clear** trên thanh công cụ để xoá sạch và bắt đầu lại từ đầu.

---

## Phần 2 — Các chức năng & ví dụ

### In đậm, in nghiêng, gạch ngang
Cú pháp: \`**đậm**\`, \`*nghiêng*\`, \`~~gạch ngang~~\`

Ví dụ: đây là chữ **in đậm**, đây là chữ *in nghiêng*, và đây là ~~chữ bị gạch ngang~~.

### Tiêu đề (Heading)
Đặt nút **H** trên thanh công cụ ở đầu dòng bất kỳ để biến nó thành tiêu đề \`## \`.

### Trích dẫn (Quote)
Cú pháp: thêm \`> \` vào đầu dòng.

> Đây là một đoạn trích dẫn — thường dùng để nhấn mạnh 1 câu nói hoặc ghi chú quan trọng.

### Code — inline và block
Inline: dùng dấu backtick đơn, ví dụ biến \`total_cost\` trong đoạn văn.

Code block: dùng 3 dấu backtick, có thể ghi kèm tên ngôn ngữ để tô màu cú pháp.

\`\`\`python
def hello():
    print("Hello AWS!")
\`\`\`

### Danh sách gạch đầu dòng (Bullet list)
- AWS Budgets — cảnh báo ngân sách
- Cost Explorer — phân tích chi phí
- Trusted Advisor — kiểm tra tối ưu chi phí

### Danh sách đánh số (Ordered list)
Bấm nút **1.** trên thanh công cụ khi con trỏ ở dòng trống sẽ tự chèn số. Nhấn **Enter** ở cuối dòng sẽ tự động sinh số tiếp theo:

1. Tạo Pricing Calculator để ước tính chi phí
2. Theo dõi bằng AWS Budgets
3. Phân tích lại bằng Cost Explorer sau khi dùng

### Checklist (việc cần làm)
- [x] Thiết kế giao diện editor
- [x] Thêm chức năng Import / Export
- [ ] Viết thêm test case cho Undo/Redo

### Liên kết & hình ảnh

// ---- Render ----
function render() {
  previewContent.innerHTML = marked.parse(editor.value);
}

// Debounce nhẹ để không render lại quá dày khi gõ nhanh
let renderTimer = null;
function scheduleRender() {
  statusText.textContent = 'Đang gõ...';
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => {
    render();
    statusText.textContent = 'Đã cập nhật';
  }, 150);
}

editor.addEventListener('input', scheduleRender);

// Khởi tạo nội dung mặc định
editor.value = defaultContent;
render();
statusText.textContent = 'Đã cập nhật';

// ---- Chế độ hiển thị: Edit / Split / Preview ----
const btnEdit = document.getElementById('btnEdit');
const btnSplit = document.getElementById('btnSplit');
const btnPreview = document.getElementById('btnPreview');

function setMode(mode) {
  frame.classList.remove('mode-edit', 'mode-split', 'mode-preview');
  frame.classList.add('mode-' + mode);
  [btnEdit, btnSplit, btnPreview].forEach(b => b.classList.remove('active'));
  if (mode === 'edit') btnEdit.classList.add('active');
  if (mode === 'split') btnSplit.classList.add('active');
  if (mode === 'preview') { btnPreview.classList.add('active'); render(); }
}
btnEdit.addEventListener('click', () => setMode('edit'));
btnSplit.addEventListener('click', () => setMode('split'));
btnPreview.addEventListener('click', () => setMode('preview'));

// ---- Import file ----
const fileInput = document.getElementById('fileInput');
const btnImport = document.getElementById('btnImport');
const dropzone = document.getElementById('dropzone');

function loadMarkdownFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    editor.value = e.target.result;
    fileNameText.textContent = file.name;
    render();
    statusText.textContent = 'Đã nhập file';
  };
  reader.onerror = () => alert('Không đọc được file. Vui lòng dùng file .md hoặc .txt.');
  reader.readAsText(file, 'UTF-8');
}
btnImport.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  loadMarkdownFile(e.target.files[0]);
  fileInput.value = '';
});

// Kéo & thả
['dragenter', 'dragover'].forEach(evt => {
  frame.addEventListener(evt, (e) => { e.preventDefault(); frame.classList.add('dragging'); });
});
['dragleave', 'drop'].forEach(evt => {
  frame.addEventListener(evt, (e) => { e.preventDefault(); frame.classList.remove('dragging'); });
});
frame.addEventListener('drop', (e) => loadMarkdownFile(e.dataTransfer.files[0]));

// ---- Toolbar: chèn / bọc cú pháp markdown tại vị trí con trỏ ----

// Bọc selection bằng syntax (vd: **text**). Nếu chưa chọn gì, chèn placeholder và bôi đen nó.
function wrapSelection(before, after, placeholder) {
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  const selected = editor.value.slice(start, end) || placeholder;
  const newText = before + selected + after;
  editor.setRangeText(newText, start, end, 'select');
  // Nếu không có selection ban đầu, bôi đen phần placeholder để gõ đè lên ngay
  if (start === end) {
    editor.selectionStart = start + before.length;
    editor.selectionEnd = start + before.length + placeholder.length;
  }
  editor.focus();
  scheduleRender();
}

// Thêm prefix vào đầu mỗi dòng đang được chọn (vd: "> ", "- ", "1. ")
function prefixLines(prefixFn) {
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  const value = editor.value;
  let lineStart = value.lastIndexOf('\n', start - 1) + 1;
  let lineEnd = value.indexOf('\n', end);
  if (lineEnd === -1) lineEnd = value.length;

  const block = value.slice(lineStart, lineEnd);
  const lines = block.split('\n');
  const newBlock = lines.map((line, i) => prefixFn(line, i)).join('\n');

  editor.setRangeText(newBlock, lineStart, lineEnd, 'select');
  editor.focus();
  scheduleRender();
}

// Chèn text tại vị trí con trỏ (không bọc)
function insertAtCursor(text, cursorOffset) {
  const start = editor.selectionStart;
  editor.setRangeText(text, start, editor.selectionEnd, 'end');
  if (cursorOffset !== undefined) {
    editor.selectionStart = editor.selectionEnd = start + cursorOffset;
  }
  editor.focus();
  scheduleRender();
}

// Bóc marker danh sách cũ (nếu có) khỏi 1 dòng, giữ lại phần thụt đầu dòng (indent) và nội dung thật.
function stripListMarker(line) {
  const m = line.match(/^(\s*)(?:[-*]\s+(?:\[[ xX]\]\s+)?|\d+\.\s+)?(.*)$/);
  return { indent: m[1], content: m[2] };
}

// Áp dụng / gỡ định dạng danh sách (ul, ol, task) theo đúng kiểu HackMD:
// - Nếu dòng đang trống (chưa gõ gì) -> LUÔN chèn marker mới để gõ tiếp (vd bấm Ordered list trên dòng trống -> ra "1. ")
// - Nếu khối dòng đang chọn ĐÃ là đúng loại marker này -> bấm lại sẽ GỠ marker (toggle off)
// - Ngược lại -> gắn/marker lại theo loại mới, đánh số liên tục bỏ qua dòng trống
function applyListFormat(markerType) {
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  const value = editor.value;
  let lineStart = value.lastIndexOf('\n', start - 1) + 1;
  let lineEnd = value.indexOf('\n', end);
  if (lineEnd === -1) lineEnd = value.length;

  const block = value.slice(lineStart, lineEnd);
  const lines = block.split('\n');
  const contentLines = lines.filter(l => l.trim() !== '');

  const testers = {
    ol: l => /^\s*\d+\.\s+/.test(l),
    ul: l => /^\s*[-*]\s+(?!\[[ xX]\])/.test(l),
    task: l => /^\s*[-*]\s+\[[ xX]\]\s+/.test(l),
  };
  // Đang bật = TẤT CẢ các dòng có nội dung trong khối đều đã đúng loại marker này
  const isActive = contentLines.length > 0 && contentLines.every(testers[markerType]);

  const markerOf = {
    ol: (n) => n + '. ',
    ul: () => '- ',
    task: () => '- [ ] ',
  };

  let n = 0;
  let caretOffsetInBlock = null; // vị trí đặt con trỏ sau khi chèn marker vào dòng trống đơn lẻ

  const newLines = lines.map((line, idx) => {
    if (!line.trim()) {
      // Dòng trống: nếu đây là dòng trống DUY NHẤT đang thao tác (không có dòng nào khác được chọn)
      // -> vẫn chèn marker để người dùng gõ tiếp ngay, giống HackMD
      if (lines.length === 1 && !isActive) {
        n++;
        const marker = markerOf[markerType](n);
        caretOffsetInBlock = marker.length;
        return marker;
      }
      return line; // dòng trống nằm giữa nhiều dòng khác -> giữ nguyên
    }
    if (isActive) {
      const { content } = stripListMarker(line); // TOGGLE OFF: gỡ marker
      return content;
    }
    n++;
    const { indent, content } = stripListMarker(line); // TOGGLE ON: gắn marker mới
    return indent + markerOf[markerType](n) + content;
  });

  const newBlock = newLines.join('\n');
  editor.setRangeText(newBlock, lineStart, lineEnd, 'select');
  if (caretOffsetInBlock !== null) {
    editor.selectionStart = editor.selectionEnd = lineStart + caretOffsetInBlock;
  }
  editor.focus();
  scheduleRender();
}

const toolbarActions = {
  undo: () => { document.execCommand('undo'); scheduleRender(); },
  redo: () => { document.execCommand('redo'); scheduleRender(); },
  bold: () => wrapSelection('**', '**', 'in đậm'),
  italic: () => wrapSelection('*', '*', 'in nghiêng'),
  strike: () => wrapSelection('~~', '~~', 'gạch ngang'),
  heading: () => prefixLines(line => '## ' + line.replace(/^#{1,6}\s*/, '')),
  code: () => {
    const hasSelection = editor.selectionStart !== editor.selectionEnd;
    const selected = editor.value.slice(editor.selectionStart, editor.selectionEnd);
    if (!hasSelection || selected.includes('\n')) {
      // Không chọn gì, hoặc chọn nhiều dòng -> dùng code block (```)
      wrapSelection('```\n', '\n```', 'code');
    } else {
      // Chọn 1 đoạn text trên 1 dòng -> dùng inline code (`)
      wrapSelection('`', '`', 'code');
    }
  },
  quote: () => prefixLines(line => '> ' + line),
  ul: () => applyListFormat('ul'),
  ol: () => applyListFormat('ol'),
  task: () => applyListFormat('task'),
  link: () => wrapSelection('[', '](https://)', 'nội dung liên kết'),
  image: () => insertAtCursor('![mô tả ảnh](https://)', 2),
  table: () => insertAtCursor(
'\n| Cột 1 | Cột 2 | Cột 3 |\n|---|---|---|\n| ô 1 | ô 2 | ô 3 |\n| ô 4 | ô 5 | ô 6 |\n'
  ),
  hr: () => insertAtCursor('\n\n---\n\n'),
  comment: () => wrapSelection('<!-- ', ' -->', 'ghi chú'),
};

document.getElementById('toolbar').addEventListener('click', (e) => {
  const btn = e.target.closest('.tb-btn');
  if (!btn) return;
  const action = toolbarActions[btn.dataset.action];
  if (action) action();
});

// Phím tắt nhanh cho Bold / Italic (giống HackMD)
editor.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey) {
    if (e.key === 'b') { e.preventDefault(); toolbarActions.bold(); }
    if (e.key === 'i') { e.preventDefault(); toolbarActions.italic(); }
    return;
  }
  if (e.key === 'Enter') handleEnterKey(e);
});

// Nhấn Enter trong 1 dòng list -> tự tiếp tục list (số tăng dần / cùng dấu gạch đầu dòng),
// giống HackMD. Nhấn Enter trên 1 dòng list đang trống (mới gõ marker chưa có nội dung) -> thoát khỏi list.
function handleEnterKey(e) {
  const pos = editor.selectionStart;
  if (pos !== editor.selectionEnd) return; // có bôi đen -> để trình duyệt xử lý bình thường
  const value = editor.value;
  const lineStart = value.lastIndexOf('\n', pos - 1) + 1;
  const currentLine = value.slice(lineStart, pos);

  // Ordered list: "  3. nội dung"
  const olMatch = currentLine.match(/^(\s*)(\d+)\.\s+(.*)$/);
  if (olMatch) {
    e.preventDefault();
    const [, indent, numStr, content] = olMatch;
    if (content.trim() === '') {
      // Dòng list trống -> Enter để thoát khỏi list: xoá marker, xuống dòng trắng
      const lineEndIdx = value.indexOf('\n', pos);
      const realLineEnd = lineEndIdx === -1 ? value.length : lineEndIdx;
      editor.setRangeText('', lineStart, realLineEnd, 'end');
      scheduleRender();
      return;
    }
    const nextNum = parseInt(numStr, 10) + 1;
    insertAtCursor('\n' + indent + nextNum + '. ');
    return;
  }

  // Bullet list / Checklist: "  - nội dung" hoặc "  - [ ] nội dung"
  const ulMatch = currentLine.match(/^(\s*)([-*])\s+(?:(\[[ xX]\])\s+)?(.*)$/);
  if (ulMatch) {
    e.preventDefault();
    const [, indent, bullet, checkbox, content] = ulMatch;
    if (content.trim() === '') {
      const lineEndIdx = value.indexOf('\n', pos);
      const realLineEnd = lineEndIdx === -1 ? value.length : lineEndIdx;
      editor.setRangeText('', lineStart, realLineEnd, 'end');
      scheduleRender();
      return;
    }
    const marker = indent + bullet + ' ' + (checkbox ? '[ ] ' : '');
    insertAtCursor('\n' + marker);
    return;
  }
}

// ---- Đổi tên file: bấm vào tên -> chuyển thành ô input để sửa ----
const fileNameInput = document.getElementById('fileNameInput');

function startRenameFile() {
  fileNameInput.value = fileNameText.textContent;
  fileNameText.style.display = 'none';
  fileNameInput.style.display = 'inline-block';
  fileNameInput.focus();
  fileNameInput.select();
}
function commitRenameFile() {
  const newName = fileNameInput.value.trim();
  if (newName) fileNameText.textContent = newName;
  fileNameInput.style.display = 'none';
  fileNameText.style.display = '';
}
fileNameText.addEventListener('click', startRenameFile);
fileNameText.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startRenameFile(); }
});
fileNameInput.addEventListener('blur', commitRenameFile);
fileNameInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); fileNameInput.blur(); }
  if (e.key === 'Escape') { fileNameInput.value = fileNameText.textContent; fileNameInput.blur(); }
});

// ---- Clear: xoá toàn bộ nội dung, có hộp thoại xác nhận trước khi xoá ----
const clearModal = document.getElementById('clearModal');
document.getElementById('btnClear').addEventListener('click', () => {
  clearModal.classList.add('show');
});
document.getElementById('clearCancel').addEventListener('click', () => {
  clearModal.classList.remove('show');
});
document.getElementById('clearConfirm').addEventListener('click', () => {
  editor.value = '';
  render();
  statusText.textContent = 'Đã xoá toàn bộ';
  clearModal.classList.remove('show');
  editor.focus();
});
// Bấm ra ngoài hộp thoại hoặc nhấn Esc -> huỷ, không xoá
clearModal.addEventListener('click', (e) => {
  if (e.target === clearModal) clearModal.classList.remove('show');
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && clearModal.classList.contains('show')) {
    clearModal.classList.remove('show');
  }
});

// ---- Export / Tải xuống ----
document.getElementById('btnExport').addEventListener('click', () => {
  const blob = new Blob([editor.value], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileNameText.textContent.endsWith('.md') ? fileNameText.textContent : fileNameText.textContent + '.md';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
